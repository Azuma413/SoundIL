[project]
name = "s2a2"
version = "0.1.0"
description = "Audio-visual imitation learning for manipulation tasks using acoustic spatial information"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ffmpeg>=1.4",
    "datasets>=4.0.0,<4.2.0",
    "huggingface-hub>=0.30.2",
    "matplotlib>=3.10.8",
    "pandas>=2.2.2,<2.4.0",
    "pyarrow>=18.0.0",
    "av>=15.0.0,<16.0.0",
    "accelerate>=1.10.0,<2.0.0",
    "deepdiff>=7.0.1,<9.0.0",
    "jsonlines>=4.0.0,<5.0.0",
    "termcolor>=2.4.0,<4.0.0",
    "pulsectl>=24.12.0",
    "py-cpuinfo>=9.0.0",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "pyroomacoustics>=0.8.3",
    "scikit-learn>=1.7.2",
    "sounddevice>=0.5.1",
    "taichi>=1.7.3",
    "torchcodec>=0.4.0",
    "torchnmf>=0.3.5",
    "websockets>=16.0",
    "dynamixel-sdk>=3.7.31,<3.9.0",
    "pyserial-asyncio>=0.6",
    "torch",
    "torchvision",
    "lerobot[pi]",
    "genesis-world",
    "pyrealsense2>=2.55.1.6486,<2.57.0 ; sys_platform != 'darwin'",
]

[tool.uv.sources]
lerobot = { path = "libs/lerobot", editable = true }
genesis-world = { path = "libs/Genesis", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
